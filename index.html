<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acompanhamento de Projetos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h2>Quadro de Projetos</h2>
    <div>
      <button id="btn-login-toggle" onclick="toggleLoginModal()">Área do Professor</button>
      <button id="btn-logout" class="hidden" onclick="handleLogout()">Sair</button>
    </div>
  </header>

  <!-- MODAL DE LOGIN PROFESSOR -->
  <div id="login-modal" class="login-pop hidden">
    <h4>Acesso Administrativo</h4>
    <input type="email" id="email" placeholder="E-mail"><br><br>
    <input type="password" id="password" placeholder="Senha"><br><br>
    <button onclick="handleLogin()">Entrar</button>
    <p id="login-error"></p>
  </div>

  <!-- PAINEL EXCLUSIVO DO PROFESSOR (Escondido por padrão) -->
  <div id="teacher-panel" class="admin-panel hidden">
    <h3>Novo Projeto</h3>
    <input type="text" id="task-title" placeholder="Nome do Projeto / Tarefa">
    <input type="text" id="student-name" placeholder="Nome do Aluno">
    <input type="text" id="Comentario" placeholder="comentário">
    <button onclick="createTask()">Cadastrar</button>
  </div>

  <!-- KANBAN PÚBLICO -->
  <div class="kanban">
    <div class="column" id="todo"><h3>A Fazer</h3><div class="cards"></div></div>
    <div class="column" id="in_progress"><h3>Em Progresso</h3><div class="cards"></div></div>
    <div class="column" id="done"><h3>Concluído</h3><div class="cards"></div></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
