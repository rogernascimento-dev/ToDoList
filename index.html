<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Supabase</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #3ecf8e; /* Cor do Supabase */
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #3ecf8e;
      border: none;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #34b27b;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #mensagem {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .sucesso { color: #2e7d32; }
    .erro { color: #d32f2f; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Novo Cadastro</h2>
    <form id="cadastroForm">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Ex: João Silva" required>
      </div>

      <div class="form-group">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" placeholder="Ex: (11) 99999-9999" required>
      </div>

      <button type="submit" id="btnSalvar">Cadastrar</button>
    </form>

    <div id="mensagem"></div>
  </div>

  <!-- Biblioteca Oficial do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // -------------------------------------------------------------
    // CONFIGURAÇÃO DO SUPABASE
    // Substitua os valores abaixo com os dados do seu projeto Supabase:
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://lzwdqkvajhblbzsibgye.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fCMzXffpGLX3aICD78zlWA_Nl6nj14q';

    // Inicializa o cliente do Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Captura dos elementos HTML
    const form = document.getElementById('cadastroForm');
    const btnSalvar = document.getElementById('btnSalvar');
    const mensagemEl = document.getElementById('mensagem');

    // Evento de envio do formulário
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // Impede o recarregamento da página

      const nome = document.getElementById('nome').value;
      const telefone = document.getElementById('telefone').value;

      // Estado de carregamento
      btnSalvar.disabled = true;
      btnSalvar.innerText = 'Salvando...';
      mensagemEl.innerText = '';
      mensagemEl.className = '';

      // Envia os dados para a tabela 'contatos' no Supabase
      const { data, error } = await supabaseClient
        .from('contatos')
        .insert([{ nome: nome, telefone: telefone }]);

      // Restaura o botão
      btnSalvar.disabled = false;
      btnSalvar.innerText = 'Cadastrar';

      if (error) {
        console.error('Erro:', error);
        mensagemEl.innerText = 'Erro ao salvar os dados!';
        mensagemEl.className = 'erro';
      } else {
        mensagemEl.innerText = 'Cadastro realizado com sucesso!';
        mensagemEl.className = 'sucesso';
        form.reset(); // Limpa o formulário
      }
    });
  </script>
</body>
</html>
